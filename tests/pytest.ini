[pytest]
testpaths = api contract e2e
addopts = -ra --strict-markers
timeout = 60
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    smoke: быстрые критические проверки
    regression: расширенный API-регресс
    security: проверки безопасности
    contract: проверки OpenAPI и JSON Schema
    e2e: браузерные сценарии
    us01: тесты регистрации и авторизации
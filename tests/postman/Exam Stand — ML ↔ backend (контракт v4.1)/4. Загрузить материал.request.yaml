$kind: http-request
description: PDF уходит в S3 (seaweedfs), дальше ML забирает его по ключу storage_key, режет на чанки и делает эмбеддинги.
url: "{{baseUrl}}/api/materials/upload"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: text
      key: courseId
      value: "{{courseId}}"
    - type: file
      key: file
      src: C:\Users\sotni\OneDrive\Рабочий стол\ai-exam\tp_ivt_team5_2026\ml\data\Лекция_№11_Многофакторный_эксперимент_Стратегическое_планирование.pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.collectionVariables.set('materialId', body.materialId);
      console.log('materialId =', body.materialId, '| statusMaterial =', body.statusMaterial);
    language: text/javascript
order: 4000

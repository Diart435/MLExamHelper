server.port = 8000
spring.datasource.url=jdbc:postgresql://postgres:5432/exam_helper_db
spring.data.redis.host=redis
spring.data.redis.port=6379
# Контейнер стримов работает опросом (poll), но падение Redis не должно висеть
# на HTTP-запросах бесконечно.
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s
# Имя клиента видно в CLIENT LIST — проще искать в мониторинге.
spring.data.redis.client-name=${spring.application.name}
# @RedisHash-сущностей в проекте нет, Spring Data Redis-репозитории не нужны.
spring.data.redis.repositories.enabled=false
                - generic [ref=e329]: Плюсы
                - generic [ref=e330]: Удобно работать в режиме вайб кодинга. Система может самостоятельно реализовывать достаточно сложные проекты. ИИ планирует реализацию проекта, выполняет план, попутно настраивая систему, устанавливает необходимые библиотеки, создает и запускает docker-контейнеры, отлаживает проект, и создает необходимую документацию. Выбор вида AI удобный, вариантов много. Я использую преимущественно deepseek pro v4 и flash. Цены приемлемые (сопоставимы с OpenRouter). Сервис на текущий момент времени работает стабильно. Проблем с пополнением счета нет. Можно гибко настраивать работу с ключами в т.ч. и для коллективной работы. Впечатление о сервисе положительное.
